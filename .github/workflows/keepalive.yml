name: Keep backend warm

on:
  schedule:
    # every 10 minutes -- Render's free tier spins down after ~15 minutes idle
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Hit /predictions for every league, not just /leagues -- this is what
      # actually keeps each league's Elo/Poisson model cache warm (24h TTL,
      # matching how often the underlying data actually changes). Render's
      # free-tier CPU is shared and its speed varies a lot run to run (the
      # exact same fit took 1.3s locally but has taken 90s+ on Render), so
      # each attempt gets a generous timeout and a failure on one league
      # doesn't stop the others from warming.
      - name: Warm each league's model cache
        run: |
          for league in EPL K1 K2 BL1; do
            echo "warming $league"
            curl -sf --max-time 180 "https://soccer-predictor-api-58tj.onrender.com/predictions?league=$league" -o /dev/null || echo "$league warm-up failed, continuing"
          done
